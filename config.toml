[global]
logfile = "/tmp/taskmaster.log"
loglevel = "debug"
user = "oprosvir"

# Signal handling tests:
# each program uses a different stop signal.
[program.test_sleep_int]
cmd = "/usr/bin/sleep 30"
autostart = true
workingdir = "/tmp"
stopsignal = "INT"
autorestart = "always"

[program.test_sleep_hup]
cmd = "/usr/bin/sleep 300"
stopsignal = "HUP"

[program.test_sleep_usr1]
cmd = "/usr/bin/sleep 300"
stopsignal = "USR1"

[program.test_sleep_quit]
cmd = "/usr/bin/sleep 300"
stopsignal = "QUIT"

# Forced-stop test: the process ignores SIGTERM until SIGKILL is sent.
[program.test_ignore_term]
cmd = '''
/usr/bin/python3 -c "
    import signal, time
    signal.signal(signal.SIGTERM, signal.SIG_IGN)
    time.sleep(300)
"'''
autostart = true
stopsignal = "TERM"
stoptime = 3

# Expected and unexpected exit codes.
[program.test_true]
cmd = "/usr/bin/true"
autostart = true

[program.test_false]
cmd = "/usr/bin/false"
autostart = true
startretries = 3

# Multiple process instances.
[program.test_workers]
cmd = "/usr/bin/sleep 30"
numprocs = 3
autostart = true

# Spawn failure and retry exhaustion.
[program.test_nonexist]
cmd = "nonexisting"

# Graceful shutdown with SIGINT.
[program.test_server]
cmd = "/usr/bin/python3 -m http.server 8080"
workingdir = "/home/oprosvir/my_website/build"
starttime = 3
stopsignal = "INT"
stdout = "/home/oprosvir/my_website/logs/server.log"
stderr = "/home/oprosvir/my_website/logs/server.err"

# Stdout redirection test
[program.ping_demo]
cmd = "/usr/bin/ping 8.8.8.8"
stdout = "/home/oprosvir/taskmaster/logs/ping.log"

# Dual-stream logging test
[program.heartbeat]
cmd = '''
/bin/sh -c '
    i=0
    while true; do
        echo "stdout heartbeat $i"
        echo "stderr heartbeat $i" >&2
        i=$((i + 1))
        sleep 1
    done
'
'''
stdout = "/home/oprosvir/taskmaster/logs/heartbeat.log"
stderr = "/home/oprosvir/taskmaster/logs/heartbeat.err"

# Permission denied for logs, discarded
[program.ping_root]
cmd = "/usr/bin/ping 8.8.8.8"
stdout = "/root/ping.log"