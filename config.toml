# =========================================================================
# GLOBAL CONFIGURATION
# =========================================================================
[global]
logfile = "./logs/taskmaster.log"
loglevel = "info"
# user = "oprosvir"

# =========================================================================
# SIGNAL HANDLING & EXIT CODES TEST CASES
# =========================================================================
# Each program uses a different stop signal to test IPC and signal routing.

[program.test_sleep_int]
cmd = "/usr/bin/sleep 30"
stopsignal = "INT"  # -2
autorestart = "always"

[program.test_sleep_hup]
cmd = "/usr/bin/sleep 300"
stopsignal = "HUP"  # -1

[program.test_sleep_usr1]
cmd = "/usr/bin/sleep 300"
stopsignal = "USR1"  # -10

[program.test_sleep_quit]
cmd = "/usr/bin/sleep 300"
stopsignal = "QUIT"  # -3

# =========================================================================
# TIMEOUT & FORCED STOP TEST CASE
# =========================================================================
# Forced-stop test: the process ignores SIGTERM until SIGKILL is sent.

[program.test_ignore_term]
cmd = '''
/usr/bin/python3 -c "
    import signal, time
    signal.signal(signal.SIGTERM, signal.SIG_IGN)
    time.sleep(300)
"'''
stopsignal = "TERM"  # SIGTERM: -15, SIGKILL: -9
stoptime = 3

# =========================================================================
# ORPHAN PREVENTION TEST CASE
# =========================================================================
# Ensures grandchild processes (spawned by sh) are terminated via PGID.

[program.test_orphan]
cmd = "/bin/sh -c 'sleep 300'"
stopsignal = "TERM"
stoptime = 3
autostart = false
autorestart = "never"

# =========================================================================
# SPAWN FAILURE & RESTART TEST CASES
# =========================================================================
# Programs exit immediately, failing to stay alive for 'starttime'

[program.test_true]
cmd = "/usr/bin/true"
starttime = 5  # default
startretries = 3  # default

[program.test_false]
cmd = "/usr/bin/false"
starttime = 2
startretries = 2

[program.test_nonexist]
cmd = "nonexisting"
starttime = 1
startretries = 1

# =========================================================================
# MULTIPLE PROCESS INSTANCES (NUMPROCS)
# =========================================================================

[program.test_workers]
cmd = "/usr/bin/sleep 30"
numprocs = 3

# =========================================================================
# WORKING DIRECTORY & WEB SERVER TEST CASES
# =========================================================================

[program.test_workingdir]
cmd = "/bin/sh -c 'pwd; ls -la; sleep 30'"
workingdir = "/tmp"
stdout = "./logs/workingdir.log"

[program.test_server]
cmd = "/usr/bin/python3 -m http.server 8080"
# TODO: copy static file to vm
# workingdir = "/home/oprosvir/my_website/build"
stdout = "./logs/server.log"
stderr = "./logs/server.err"

# =========================================================================
# I/O REDIRECTION & LOGGING TEST CASES
# =========================================================================

# Stdout redirection test
[program.ping_demo]
cmd = "/usr/bin/ping 8.8.8.8"
stdout = "./logs/ping.log"

# Dual-stream logging test
[program.heartbeat]
cmd = '''
/bin/sh -c '
    i=0
    while true; do
        echo "stdout heartbeat $i"
        echo "stderr heartbeat $i" >&2
        i=$((i + 1))
        sleep 1
    done
'
'''
stdout = "./logs/heartbeat.log"
stderr = "./logs/heartbeat.err"

# Permission denied for logs, discarded
[program.ping_root]
cmd = "/usr/bin/ping 8.8.8.8"
stdout = "/root/ping.log"

# =========================================================================
# AUTORESTART POLICY TEST CASES
# =========================================================================

[program.test_always]
cmd = "/bin/sh -c 'echo \"[Always] Running...\"; sleep 2; echo \"[Always] Exiting with 0\"; exit 0'"
autostart = false
autorestart = "always"
starttime = 1
stdout = "./logs/autorestart.log"

[program.test_never]
cmd = "/bin/sh -c 'echo \"[Never] Running...\"; sleep 2; echo \"[Never] Crashing with 1\"; exit 1'"
autostart = false
autorestart = "never"
starttime = 1
stdout = "./logs/autorestart.log"

[program.test_unexpected]
cmd = "/bin/sh -c 'echo \"[Unexpected] Running...\"; sleep 2; echo \"[Unexpected] Exiting with 2\"; exit 2'"
autostart = false
autorestart = "unexpected"
exitcodes = [0, 1]
starttime = 1
stdout = "./logs/autorestart.log"

# =========================================================================
# ENVIRONMENT VARIABLES (ENV)
# =========================================================================

[program.test_env]
cmd = "/bin/sh -c 'echo \"FOO=$FOO, APP_ENV=$APP_ENV\"; sleep 30'"
env = { FOO = "taskmaster_bar", APP_ENV = "production" }
stdout = "./logs/env.log"

# =========================================================================
# FILE CREATION MASK (UMASK)
# =========================================================================

[program.test_umask]
cmd = '''
/bin/sh -c '
    umask
    touch /tmp/taskmaster_umask_test.txt
    ls -l /tmp/taskmaster_umask_test.txt
    rm -f /tmp/taskmaster_umask_test.txt
    sleep 30
'
'''
umask = "077"  # -rw------- (0600)
stdout = "./logs/umask.log"

# =========================================================================
# HIGH OUTPUT VOLUME TEST CASE (STRESS TEST)
# =========================================================================
# Generates 500,000 lines (~15 MB) instantly to test deadlock on OS pipe 
# buffers (64 KB).

[program.test_flood]
cmd = "/bin/sh -c 'yes \"Taskmaster high volume output flood test\" | head -n 500000; sleep 30'"
starttime = 1
stdout = "./logs/flood.log"