[global]
logfile = "/tmp/taskmaster.log"
loglevel = "INFO"

[program.test_sleep]
cmd = "/usr/bin/sleep 300"
numprocs = 1
autostart = true
autorestart = "unexpected"
exitcodes = 0
starttime = 2
startretries = 3
stopsignal = "TERM"
stoptime = 5
stdout = "/tmp/test_sleep.stdout"
stderr = "/tmp/test_sleep.stderr"
workingdir = "/tmp"